services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: whalexy
      POSTGRES_DB: whalexy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique PostgreSQL password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U whalexy -d whalexy]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://whalexy:${POSTGRES_PASSWORD}@postgres:5432/whalexy?schema=public
    command: [npx, prisma, migrate, deploy]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://whalexy:${POSTGRES_PASSWORD}@postgres:5432/whalexy?schema=public
      NODE_ENV: production
      PYTHON_BINARY: python3
    ports: ["3000:3000"]
    volumes: ["media-data:/app/uploads"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://whalexy:${POSTGRES_PASSWORD}@postgres:5432/whalexy?schema=public
      NODE_ENV: production
      PYTHON_BINARY: python3
    command: [node, dist/src/worker.js]
    volumes: ["media-data:/app/uploads"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
volumes:
  postgres-data:
  media-data:
